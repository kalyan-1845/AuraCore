version: '3.8'

services:
  auracore:
    build: .
    container_name: auracore-elite
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./backend/aura_memory.db:/app/backend/aura_memory.db
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  default:
    name: auracore-network
